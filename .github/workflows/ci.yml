name: CI

on:
  push:

# Superseded runs on the same branch are not worth finishing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both Playwright projects are Chromium (Desktop Chrome and Pixel 5)
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      # The full suite, screenshot specs included. playwright.config.js builds
      # the app and starts it on 3210 itself; CI sets retries to 2 there.
      - name: UI tests
        run: npm run test:ui

      # The HTML report carries the screenshot diffs, traces and videos, which
      # are the only way to judge a snapshot failure after the fact.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
