name: Deploy

# Vercel's Git integration builds off the push webhook and cannot see CI, so
# deploying from here is what gates it. workflow_run fires once CI has finished
# for a commit; the conclusion check below is what makes a red CI stop a deploy.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Vercel
    # Opt in with the VERCEL_DEPLOY repository variable once the secrets exist.
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.VERCEL_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      # workflow_run starts on the default branch, so the commit CI actually
      # tested has to be checked out by sha rather than taken from the trigger.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Select deployment target
        run: |
          if [ "${{ github.event.workflow_run.head_branch }}" = "${{ github.event.repository.default_branch }}" ]; then
            echo "TARGET=production" >> "$GITHUB_ENV"
            echo "PROD_FLAG=--prod" >> "$GITHUB_ENV"
          else
            echo "TARGET=preview" >> "$GITHUB_ENV"
            echo "PROD_FLAG=" >> "$GITHUB_ENV"
          fi

      - name: Pull Vercel environment
        run: vercel pull --yes --environment="$TARGET" --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build $PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt $PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }}
