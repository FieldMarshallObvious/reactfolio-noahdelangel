name: CD

# Called by CI once its verify job is green - see the deploy job in ci.yml.
# This is workflow_call, not workflow_run: a local ./ reference resolves against
# the calling branch's own commit, so it works on every branch with no
# dependency on what the default branch happens to contain.
on:
  workflow_call:
  # Also allows a deploy by hand from any branch without re-running the suite.
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Vercel
    # Tag pushes have no branch to map onto a Vercel environment.
    if: ${{ github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Default branch goes to production, every other branch gets a preview
      # deployment with its own URL - the same split Vercel's own integration makes.
      - name: Select deployment target
        run: |
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            echo "TARGET=production" >> "$GITHUB_ENV"
            echo "PROD_FLAG=--prod" >> "$GITHUB_ENV"
          else
            echo "TARGET=preview" >> "$GITHUB_ENV"
            echo "PROD_FLAG=" >> "$GITHUB_ENV"
          fi

      # --git-branch picks up any branch-scoped environment variables set in Vercel.
      - name: Pull Vercel environment
        run: vercel pull --yes --environment="$TARGET" --git-branch="${{ github.ref_name }}" --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build $PROD_FLAG --token="$VERCEL_TOKEN"

      - name: Deploy
        run: |
          url=$(vercel deploy --prebuilt $PROD_FLAG --token="$VERCEL_TOKEN")
          echo "### $TARGET deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
